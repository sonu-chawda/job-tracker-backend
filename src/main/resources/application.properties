spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/job_tracker?createDatabaseIfNotExist=true}

spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-123456}
jwt.expiration-ms=86400000

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}

server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}